# Render asigna el puerto por la variable PORT; el 8080 de respaldo mantiene
# intactos el desarrollo local y docker-compose.
server:
  port: ${PORT:8080}

spring:
  application:
    name: dentalcite

  # Configuración de PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dentalcite_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # Configuración de JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway crea las tablas, Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC # Fundamental para evitar problemas de fechas
  
  # Habilitar Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true


  # Configuración de Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false

# Configuración de Logs (Reducir alertas en consola)
logging:
  level:
    # Ocultar advertencias por defecto de SpringDoc en dev
    "[org.springframework.core.events.SpringDocAppInitializer]": ERROR
    # Ocultar log innecesario de JTA Platform de Hibernate
    "[org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator]": ERROR

# Configuración funcional de la clínica
app:
  # Los horarios de atención se declaran como hora local (LocalTime) y las citas y
  # los bloqueos se guardan en UTC (TIMESTAMPTZ). El motor de disponibilidad
  # (HU-08) tiene que comparar unos con otros, y sin una zona de clínica declarada
  # esa comparación no está definida. Perú no aplica horario de verano.
  zona-horaria: ${APP_ZONA_HORARIA:America/Lima}
  # RN-17: los umbrales de RN-05 y RN-07 se declaran como configuración
  # externa, ajustable sin recompilar. Antes eran constantes en el código, de
  # modo que mover la antelación mínima obligaba a reconstruir el artefacto.
  citas:
    antelacion-minima-horas: ${APP_CITAS_ANTELACION_MINIMA_HORAS:2}
    horizonte-maximo-dias: ${APP_CITAS_HORIZONTE_MAXIMO_DIAS:90}
    maximo-activas-por-paciente: ${APP_CITAS_MAXIMO_ACTIVAS:3}
    # HU-10: cuánto vive el bloqueo distribuido de una franja. Corto a propósito,
    # para que un proceso que muera con el bloqueo tomado no deje la franja
    # irreservable más que unos segundos. Se declara aquí, y no solo como valor
    # por defecto en el código, porque es el mismo tipo de palanca de despliegue
    # que el resto de umbrales de RN-17.
    bloqueo-ttl-segundos: ${APP_CITAS_BLOQUEO_TTL:10}
  disponibilidad:
    # RNF-01 fija su umbral sobre catorce días. Es configuración y no una constante
    # porque la contingencia del riesgo R-01 consiste exactamente en bajarlo a
    # siete: un cambio de despliegue, no de código.
    dias-maximos: ${APP_DISPONIBILIDAD_DIAS_MAXIMOS:14}
    cache-ttl-segundos: ${APP_DISPONIBILIDAD_CACHE_TTL:60}

# Configuración de OpenAPI (Swagger)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Configuración de Seguridad
# Sin valor por defecto a propósito: si falta JWT_SECRET la aplicación no
# arranca. Un default aquí viaja dentro del jar a todos los entornos, así que
# un despliegue que olvidase la variable firmaría con una clave que cualquiera
# puede leer en el repositorio. El valor de desarrollo lo aporta el entorno,
# no el artefacto: docker-compose.yml para `docker compose up`, y el
# spring-boot-maven-plugin para `./mvnw spring-boot:run` (RNF-11: una sola
# orden, sin pasos manuales, sin secreto versionado).
jwt:
  secret: ${JWT_SECRET}