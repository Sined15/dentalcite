services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dentalcite_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-local-cambiar-en-despliegue-000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      APP_ZONA_HORARIA: ${APP_ZONA_HORARIA:-America/Lima}
      APP_CITAS_ANTELACION_MINIMA_HORAS: ${APP_CITAS_ANTELACION_MINIMA_HORAS:-2}
      APP_CITAS_HORIZONTE_MAXIMO_DIAS: ${APP_CITAS_HORIZONTE_MAXIMO_DIAS:-90}
      APP_CITAS_MAXIMO_ACTIVAS: ${APP_CITAS_MAXIMO_ACTIVAS:-3}
      APP_CITAS_ANTELACION_CANCELACION_HORAS: ${APP_CITAS_ANTELACION_CANCELACION_HORAS:-24}

      APP_CITAS_BLOQUEO_TTL: ${APP_CITAS_BLOQUEO_TTL:-10}

      APP_DISPONIBILIDAD_DIAS_MAXIMOS: ${APP_DISPONIBILIDAD_DIAS_MAXIMOS:-14}
      APP_DISPONIBILIDAD_CACHE_TTL: ${APP_DISPONIBILIDAD_CACHE_TTL:-60}
      TZ: UTC

  client:
    profiles: ["cliente"]
    image: ${CLIENT_IMAGE:-dentalcite/client:latest}
    build:
      context: ../dentalcite-ui
      args:
        CONFIGURACION: local
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-dentalcite_db}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-dentalcite_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
